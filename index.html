<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>公司开票信息管理</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="page" id="appPage" hidden>
    <header class="page-header">
      <div class="heading-group">
        <div class="title-line">
          <h1>公司开票信息管理</h1>
          <span class="cloud-badge"><span class="status-dot"></span>云端同步</span>
        </div>
        <p class="subtitle">输入公司名称、税号、银行或其他关键词，即可快速查询。</p>
      </div>
      <div class="header-right">
        <div class="member-info"><span id="currentActor"></span><button id="logoutBtn" type="button">退出</button></div>
        <div class="toolbar" aria-label="页面操作">
          <button class="btn" id="refreshBtn" type="button">刷新数据</button>
          <button class="btn" id="exportBtn" type="button">导出备份</button>
          <button class="btn" id="importBtn" type="button">导入备份</button>
          <input type="file" id="importFile" accept="application/json" />
          <button class="btn" id="trashBtn" type="button">回收站</button>
          <button class="btn primary" id="addBtn" type="button">＋ 新增开票信息</button>
        </div>
      </div>
    </header>

    <section class="search-panel" aria-label="搜索公司开票信息">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="6.8" stroke="currentColor" stroke-width="1.8"/><path d="m16.2 16.2 4.1 4.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input class="search-input" id="searchInput" autocomplete="off" placeholder="请输入公司关键词，例如：智牧、医院、统一社会信用代码……" />
      <span class="sync-text" id="syncText">正在同步…</span>
      <span class="count" id="countText">共0家公司</span>
    </section>

    <section class="view-banner" id="viewBanner">
      <span id="viewBannerText">当前正在查看公司列表。</span>
      <button class="btn small" id="backBtn" type="button">查看回收站</button>
    </section>

    <section class="content"><div class="list" id="companyList"></div></section>
    <p class="footer-note">数据统一保存在云数据库中，页面功能更新不会覆盖历史资料。系统每10秒检查一次其他设备的最新修改，建议同时保留定期导出备份。</p>
  </main>

  <section class="login-screen" id="loginScreen">
    <div class="login-card">
      <div class="login-icon">票</div>
      <h2>公司开票信息管理</h2>
      <p>请输入团队成员姓名和访问口令。验证通过后即可查看并维护共享数据。</p>
      <form id="loginForm">
        <label>姓名或昵称</label>
        <input id="actorInput" maxlength="30" autocomplete="name" placeholder="用于记录谁进行了修改" required />
        <label>团队访问口令</label>
        <input id="passwordInput" type="password" autocomplete="current-password" placeholder="请输入团队访问口令" required />
        <button class="btn primary login-submit" type="submit">进入管理工具</button>
      </form>
      <div class="login-error" id="loginError"></div>
    </div>
  </section>

  <dialog id="editor" aria-labelledby="modalTitle">
    <div class="modal-header">
      <div><div class="modal-title" id="modalTitle">新增开票信息</div><div class="modal-subtitle">请按照营业执照及银行资料准确填写</div></div>
      <button class="close-button" id="closeBtn" type="button" aria-label="关闭">×</button>
    </div>
    <form id="companyForm">
      <div class="form-grid">
        <div class="field full"><label for="companyName">公司名称 <span class="required">*</span></label><input id="companyName" maxlength="100" required placeholder="请输入完整公司名称" /></div>
        <div class="field full"><label for="taxNo">纳税人识别号 / 统一社会信用代码 <span class="required">*</span></label><input id="taxNo" maxlength="40" required placeholder="请输入税号" /></div>
        <div class="field"><label for="address">注册地址 <span class="required">*</span></label><input id="address" maxlength="150" required placeholder="请输入注册地址" /></div>
        <div class="field"><label for="phone">注册电话</label><input id="phone" maxlength="40" placeholder="请输入注册电话" /></div>
        <div class="field"><label for="bankName">开户银行 <span class="required">*</span></label><input id="bankName" maxlength="100" required placeholder="请输入开户银行" /></div>
        <div class="field"><label for="bankAccount">银行账号 <span class="required">*</span></label><input id="bankAccount" maxlength="60" required placeholder="请输入银行账号" /></div>
        <div class="field full"><label for="remark">备注</label><textarea id="remark" maxlength="300" placeholder="可填写联系人、开票要求等补充信息"></textarea></div>
      </div>
      <div class="modal-footer"><button type="submit" class="btn primary" id="saveBtn">保存信息</button></div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
